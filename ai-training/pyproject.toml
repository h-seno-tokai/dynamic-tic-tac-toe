[project]
name = "dttt-train"
version = "0.1.0"
description = "AlphaZero training scaffold for the DTTT Gobblet-clone game (3x3 / 4x4 universal network)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DTTT" }]

dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Optional experiment trackers - not required to run training.
# Pick one if you want logging:
#   tensorboard>=2.16
#   wandb>=0.17
tracking = [
    "tensorboard>=2.16",
]

[project.scripts]
dttt-train = "dttt_train.train:main"
dttt-export-onnx = "dttt_train.export_onnx:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dttt_train"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
files = ["src/dttt_train", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
